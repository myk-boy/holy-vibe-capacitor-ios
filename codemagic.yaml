workflows:
  ios-capacitor-build:
    name: iOS Signed Build (Capacitor SPM)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
      # Вказуємо твій Bundle ID як змінну для зручності
      BUNDLE_ID: "com.mykboy.holyvibe"
    scripts:
      - name: Install Dependencies
        script: |
          npm install
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Decode GoogleService-Info.plist
        script: |
          echo $GOOGLE_SERVICES_PLIST | base64 --decode > ios/App/App/GoogleService-Info.plist
      - name: Add GoogleService-Info.plist to Xcode project
        script: |
          test -f ios/App/App/GoogleService-Info.plist || { echo "GoogleService-Info.plist не знайдено"; exit 1; }
          ruby -e '
          require "xcodeproj"
          proj = Xcodeproj::Project.open("ios/App/App.xcodeproj")
          target = proj.targets.find { |t| t.name == "App" }
          group = proj.main_group.find_subpath("App", true)
          ref = group.files.find { |f| f.path == "GoogleService-Info.plist" } || group.new_file("GoogleService-Info.plist")
          target.add_resources([ref]) unless target.resources_build_phase.files_references.include?(ref)
          proj.save
          '
      
      # --- КРОКИ АВТОМАТИЧНОГО ПІДПИСАННЯ ---
      - name: Initialize keychain
        script: |
          keychain initialize

      - name: Fetch signing files from App Store Connect
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type APP_STORE

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Set up code signing in Xcode project
        script: |
          xcode-project use-profiles

      # --- ЗБІРКА АРХІВУ З ПІДПИСОМ ---
      - name: Build iOS Project (.xcarchive)
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath $HOME/build/App.xcarchive \
                     archive \
                     -allowProvisioningUpdates
    
    artifacts:
      - $HOME/build/App.xcarchive