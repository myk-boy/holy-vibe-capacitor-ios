workflows:
  ios-capacitor-build:
    name: iOS Signed Build (Capacitor SPM)
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic-AppStore-Key
    environment:
      groups:
        # у групі мають бути секретні змінні:
        #   GOOGLE_SERVICES_PLIST   — base64 від GoogleService-Info.plist
        #   CERTIFICATE_PRIVATE_KEY — вміст приватного ключа (див. інструкцію)
        - firebase_ios
      node: latest
      xcode: latest
    scripts:
      - name: Install Dependencies
        script: |
          npm install

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Put GoogleService-Info.plist in place
        script: |
          if [ -n "$GOOGLE_SERVICES_PLIST" ]; then
            echo "$GOOGLE_SERVICES_PLIST" | base64 --decode > ios/App/App/GoogleService-Info.plist
          fi
          test -s ios/App/App/GoogleService-Info.plist || { echo "GoogleService-Info.plist відсутній або порожній"; exit 1; }

      - name: Add GoogleService-Info.plist to Xcode project
        script: |
          ruby -e '
          require "xcodeproj"
          proj = Xcodeproj::Project.open("ios/App/App.xcodeproj")
          target = proj.targets.find { |t| t.name == "App" }
          group = proj.main_group.find_subpath("App", true)
          ref = group.files.find { |f| f.path == "GoogleService-Info.plist" } || group.new_file("GoogleService-Info.plist")
          target.add_resources([ref]) unless target.resources_build_phase.files_references.include?(ref)
          proj.save
          '

      - name: Set build number
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" ios/App/App.xcodeproj/project.pbxproj

      - name: Initialize keychain
        script: |
          keychain initialize

      - name: Fetch or create signing files
        script: |
          app-store-connect fetch-signing-files "com.mykboy.holyvibe" --type IOS_APP_STORE --create

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Set up code signing in Xcode project
        script: |
          xcode-project use-profiles

      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true