workflows:
  ios-capacitor-build:
    name: iOS Unsigned Build (Capacitor SPM)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
    scripts:
      - name: Install Dependencies
        script: |
          npm install
      - name: Build Web Assets & Sync Capacitor
        script: |
          npm run build
          npx cap sync ios
      - name: Build iOS Workspace (.xcarchive)
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath $HOME/build/App.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO
    artifacts:
      - $HOME/build/App.xcarchive